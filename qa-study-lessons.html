<!doctype html><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>sommNI · Study lesson review</title>
<link rel="stylesheet" href="./src/intelligence/intelligence.css">
<style>body{margin:0;padding:32px;background:#f7f4eb;color:#293225;font:16px/1.6 system-ui;--font-heading:Georgia,serif}main{max-width:1120px;margin:auto}h1{font:40px Georgia,serif}button{font:inherit;cursor:pointer}.wl-kicker{font-size:11px;letter-spacing:.12em}.wl-muted{color:#5e6556}.small{font-size:12px}.wl-primary,.wl-outline{padding:12px 18px;border-radius:10px;border:1px solid #879572;background:#384c30;color:white}.wl-text-button{background:none;border:0;color:#455a35;text-decoration:underline;padding:10px}.preview{background:#152016;color:#9cbd8b;padding:20px;border-radius:18px;margin:25px 0;width:min(576px,calc(100% - 40px));min-height:248px}.preview pre{white-space:pre-wrap;font:16px/1.5 monospace;margin:8px 0}.preview small{display:block;margin-top:10px}#checks{font-size:12px;max-height:150px;overflow:auto;white-space:pre-wrap}@media(max-width:640px){body{padding:16px}.preview{width:auto}h1{font-size:30px}}</style>
<main><p class="wl-kicker">SOMMNI · BETA 3.6.2</p><h1>Understand the wine behind the answer.</h1><p>Real generated daily edition. This review uses a local copy and simulated bridge; it makes no paid requests and does not change your study progress.</p><details><summary>Verification results</summary><pre id="checks">Running…</pre></details><section aria-label="G2 browser bridge preview"><p class="wl-kicker">G2 PASSAGE PREVIEW · APPROXIMATE HARDWARE FONT</p><div class="preview"><strong id="g2-title"></strong><pre id="g2-body"></pre><small id="g2-hint"></small></div><button id="g2-next">Tap / next passage</button> <button id="g2-back">Double tap / Home</button></section><section id="tab-study"></section></main>
<script type="module">
import {initDaily,loadDaily,dailyState,answerDaily,reviewDaily} from './src/intelligence/daily';
import {saved,setLocale} from './src/intelligence/client';
import {connectIntelligenceGlasses,openDailyGlasses,handleIntelligenceGlasses,studyPassages,dailyTeachingSections} from './src/intelligence/glasses';
import {validateGlassesPage} from './src/glasses-page';
import {imageIdle} from './src/image-utils';
const checks=[],check=(ok,label)=>{if(!ok)throw Error(label);checks.push(label);},wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
const originalFetch=window.fetch,storage=new Map();saved.get=async(k,f)=>storage.has(k)?structuredClone(storage.get(k)):f;saved.set=async(k,v)=>{storage.set(k,structuredClone(v));};
let calls=0,pages=[];
try{
 const edition=(await (await originalFetch('./qa-study-edition.json')).json()).body;
 check(edition.version==='6'&&edition.questions.length===20,'real revised daily edition contains 20 questions');
 const old=structuredClone(edition);old.id='daily:3:qa-old:en';old.version='3';old.questions.forEach(q=>delete q.lesson);
 storage.set('daily:'+edition.day+':en',old);storage.set('daily:'+old.id,old);storage.set('progress:'+old.id,{answers:{q1:3},revisit:['q1']});storage.set('daily-archive',[{id:old.id,day:old.day,locale:'en'}]);
 window.fetch=async(url,init)=>{if(!String(url).includes('/functions/v1/winelens-beta'))return originalFetch(url,init);calls++;const body=JSON.parse(init.body);if(body.action==='daily')return Response.json(edition);if(body.action==='daily_archive')return Response.json({editions:[edition]});throw Error('Unexpected network action '+body.action);};
 await setLocale('en');initDaily();await loadDaily();check(calls===1&&dailyState().edition.id===edition.id,'old today cache cannot mask improved edition');check(Object.keys(dailyState().progress.answers).length===0,'answers from old questions never transfer to new edition');
 await answerDaily(edition.questions[0].correct_index);check(document.querySelectorAll('.intel-lesson section').length===3,'answer displays expectation, key detail and practice');check(document.querySelector('.intel-lesson-sources').textContent.includes('WSET'),'teaching reference visible separately from bottle references');
 const before=calls;await loadDaily();check(calls===before&&dailyState().index===1,'new edition resumes next unanswered question offline');await loadDaily(old.id);check(dailyState().progress.answers.q1===3&&calls===before,'older edition and its answers remain retrievable offline');reviewDaily();check(!document.querySelector('.intel-lesson')&&document.querySelector('.intel-explanation'),'legacy feedback remains readable');await loadDaily();reviewDaily();
 for(const q of edition.questions){const sections=dailyTeachingSections(q,true),pages=studyPassages(sections);check(sections.length===4,q.id+' has four distinct teaching sections');check(pages.every(p=>Array.from(p).length<=470&&new TextEncoder().encode(p).length<=740),q.id+' G2 passages fit character and byte budgets');check(pages.join('').replace(/\s/gu,'')===sections.join('').replace(/\s/gu,''),q.id+' no lesson text lost');check(q.lesson.references.length>0&&q.lesson.key_detail.source.url.startsWith('https://www.wsetglobal.com/'),q.id+' has real profile and teaching references');}
 for(const text of ['Wörter und Sätze. '.repeat(200),'清新な酸味と繊細な香り。'.repeat(150),'a'.repeat(1600)]){const pages=studyPassages([text]);check(pages.every(p=>Array.from(p).length<=470&&new TextEncoder().encode(p).length<=740),'unicode and long-token safety');check(pages.join('').replace(/\s/gu,'')===text.replace(/\s/gu,''),'unicode text preserved');}
 const bridge={rebuildPageContainer:async p=>{validateGlassesPage(p);pages.push(p);document.querySelector('#g2-title').textContent=p.textObject?.find(t=>t.containerName==='intel-title')?.content||'HOME';document.querySelector('#g2-body').textContent=p.textObject?.find(t=>t.containerName==='intel-body')?.content||p.listObject?.[0]?.itemContainer?.itemName.join('\n')||'';document.querySelector('#g2-hint').textContent=p.textObject?.find(t=>t.containerName==='intel-hint')?.content||'';return true;},updateImageRawData:async()=> 'success',textContainerUpgrade:async()=>true,audioControl:async()=>true};
 connectIntelligenceGlasses(bridge,location.origin+'/sommNI/');await openDailyGlasses();check(document.querySelector('#g2-body').textContent.includes(edition.questions[0].explanation),'G2 begins with why the answer fits');
 const expected=studyPassages(dailyTeachingSections(edition.questions[0],true));for(let i=1;i<expected.length;i++){await wait(360);handleIntelligenceGlasses({textEvent:{eventType:0}});await imageIdle();await wait(15);check(document.querySelector('#g2-body').textContent===expected[i],'ring tap reads teaching passage '+(i+1));}
 await wait(360);handleIntelligenceGlasses({textEvent:{eventType:0}});await imageIdle();await wait(15);check(pages.at(-1).listObject?.[0].containerName==='intel-options','Next question offered only after lesson passages');
 handleIntelligenceGlasses({sysEvent:{eventType:3}});await imageIdle();await wait(150);check(pages.at(-1).listObject?.[0].containerName==='home-list','double tap exits study gracefully');await openDailyGlasses();
 document.querySelector('#checks').textContent=JSON.stringify({passed:checks.length,checks,edition:edition.id,notes:'Real content copied locally; bridge and storage simulated. Hardware fit remains unverified.'},null,2);
 document.querySelector('#g2-next').onclick=()=>handleIntelligenceGlasses({textEvent:{eventType:0}});document.querySelector('#g2-back').onclick=()=>handleIntelligenceGlasses({sysEvent:{eventType:3}});
}catch(error){document.querySelector('#checks').textContent=JSON.stringify({error:error.stack,passed:checks.length,checks},null,2);}
</script>
