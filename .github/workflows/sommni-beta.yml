name: sommNI beta release checks
on:
  push:
    branches: ['codex/sommni-beta-*']
jobs:
  beta:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:beta
      - run: npm run build
      - run: npm run pack:beta
