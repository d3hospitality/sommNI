<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>sommNI Initiative UI test</title><style>body{background:#10100f;color:#eee;margin:0;padding:24px;font:16px system-ui}main{max-width:720px;margin:auto}button{padding:10px}#test-state{white-space:pre-wrap;font:12px monospace;color:#aaa}</style></head><body><main><p>LOCAL UI TEST · no production writes</p><button id="toggle">Switch to guest</button><div id="banner"></div><div id="review"></div><output id="test-state"></output></main><script type="module">
import {mountWineCommunity,mountInitiativeBanner} from '../src/community/initiative-ui.ts';
let session={user:{id:'qa'}},handlers=[],mine=null,profile={handle:'Test contributor',leaderboard_visible:true};const calls=[];let signed=0;
const other={id:'other',author:'Other contributor',rating:3,comment:'A fresh, lively wine with citrus and a long finish.',vintage_key:'2021',mine:false,created_at:new Date().toISOString()};
const client={auth:{getSession:async()=>({data:{session}}),onAuthStateChange:fn=>{handlers.push(fn);return {data:{subscription:{unsubscribe(){handlers=handlers.filter(x=>x!==fn)}}}}}},rpc:async(name,args)=>{calls.push({name,args});document.querySelector('#test-state').textContent=JSON.stringify(calls.slice(-4),null,2);if(name==='sommni_reviews'){const rows=mine?[mine,other]:[other];return {data:{ready:true,count:rows.length,average:rows.reduce((a,b)=>a+b.rating,0)/rows.length,reviews:rows.map(r=>({...r,mine:!!session&&r.id==='qa-review'})),mine:session&&mine?[mine]:[]}}}if(name==='sommni_review_save'){mine={id:'qa-review',rating:args.stars,comment:args.body,vintage_key:args.v,author:profile.handle,status:'published',mine:true,created_at:new Date().toISOString()};return {data:{saved:true}}}if(name==='sommni_review_remove'){mine=null;return {data:{removed:true}}}if(name==='sommni_review_report')return {data:{reported:true}};if(name==='sommni_initiative_state')return {data:{points:mine?1+(mine.comment.length>=40?2:0):0,leaderboard:mine?[{handle:profile.handle,points:mine.comment.length>=40?3:1,wines:0,reviews:1}]:[],wine_count:219}};if(name==='sommni_community_state')return {data:{profile}};if(name==='sommni_save_member'){profile={handle:args.name,leaderboard_visible:args.visible};return {data:{profile}}}return {error:{message:'Unhandled test RPC'}}}};
const join=()=>{signed++;document.querySelector('#test-state').textContent='Signup requested '+signed};
mountInitiativeBanner(document.querySelector('#banner'),client,join,()=>document.querySelector('#test-state').textContent='Add wine requested');
mountWineCommunity(document.querySelector('#review'),client,{ref:'qa-wine',name:'QA wine',producer:'QA producer',vintage:'2022'},join);
document.querySelector('#toggle').onclick=()=>{session=session?null:{user:{id:'qa'}};handlers.forEach(h=>h('SIGNED_IN',session));document.querySelector('#toggle').textContent=session?'Switch to guest':'Switch to account'};
</script></body></html>
