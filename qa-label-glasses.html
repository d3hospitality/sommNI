<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Glasses label review QA</title><style>body{margin:20px;background:#11140f;color:#ddd;font:14px system-ui;--gold:#dbbd68;--line:#353a2a;--text:#e5e6d9;--bg-card:#15180f}canvas{width:100%;max-width:864px;background:#000;image-rendering:auto}button{padding:10px;background:#d8bd72;color:#111;border:0;border-radius:6px;cursor:pointer}pre{white-space:pre-wrap}.wl-muted{color:#aaa}#app{max-width:900px}select{max-width:100%}</style><h1>Glasses label review</h1><p>Isolated QA: mocked searches, clipping and master receipts; real bottle files, storage, app queue and glasses renderer. No production writes.</p><button id="run">Run label checks</button><pre id="checks">Ready</pre><canvas id="g2" width="576" height="288"></canvas><div id="app"><div id="library"></div></div>
<script type="module">
if(location.hostname!=='sommni-batch-qa.localhost')throw Error('Isolated QA origin required');
const realFetch=window.fetch.bind(window),cuts=[],queries=[];let options=[];
window.fetch=async(input,init)=>{const url=new URL(String(input),location.href);if(url.origin===location.origin||url.protocol==='data:')return realFetch(input,init);const b=JSON.parse(init?.body||'{}');if(b.action==='bottle_candidates'){queries.push(b.wine_name);return Response.json({candidates:options});}if(b.action==='lookup'){cuts.push(b.photo);return Response.json({draft:{url:b.photo,path:'qa',source:'photograph',provenance:{}}});}if(b.action==='contribute')return Response.json({received:true,id:'qa-only'});throw Error('QA blocked external '+b.action);};
const A=await import('./src/artwork-store'),Store=await import('./src/beta/store');A.setArtworkOwner('beta-local');
const G=await import('./src/research/label-glasses'),S=await import('./src/research/label-session'),UI=await import('./src/research/label-phone'),WG=await import('./src/winebrary-glasses'),I=await import('./src/image-utils');
const canvas=document.querySelector('#g2'),ctx=canvas.getContext('2d');let page,activeCalls=0,maxCalls=0,rebuilds=0;const images=new Map();
function text(box){ctx.fillStyle='#000';ctx.fillRect(box.xPosition,box.yPosition,box.width,box.height);ctx.fillStyle='#91da8b';ctx.font='18px Arial';ctx.textBaseline='top';ctx.save();ctx.beginPath();ctx.rect(box.xPosition,box.yPosition,box.width,box.height);ctx.clip();String(box.content||'').split('\n').forEach((line,i)=>ctx.fillText(line,box.xPosition,box.yPosition+i*27));ctx.restore();}
const bridge={rebuildPageContainer:async p=>{activeCalls++;maxCalls=Math.max(maxCalls,activeCalls);page=p;rebuilds++;ctx.clearRect(0,0,576,288);p.textObject?.forEach(text);p.listObject?.forEach(box=>{ctx.fillStyle='#91da8b';ctx.font='18px Arial';box.itemContainer.itemName.forEach((item,i)=>ctx.fillText((i===0?'> ':'  ')+item,box.xPosition,box.yPosition+i*40));});await new Promise(r=>setTimeout(r,10));activeCalls--;return true;},textContainerUpgrade:async u=>{activeCalls++;maxCalls=Math.max(maxCalls,activeCalls);const box=page.textObject.find(b=>b.containerID===u.containerID);if(box)text({...box,content:u.content});await new Promise(r=>setTimeout(r,5));activeCalls--;return true;},updateImageRawData:async u=>{activeCalls++;maxCalls=Math.max(maxCalls,activeCalls);const box=page.imageObject.find(b=>b.containerID===u.containerID);const image=await createImageBitmap(new Blob([new Uint8Array(u.imageData)],{type:'image/png'}));if(box){ctx.drawImage(image,box.xPosition,box.yPosition);images.set(u.containerName,u.imageData);}image.close();activeCalls--;return 'success';},getLocalStorage:async()=>'',setLocalStorage:async()=>true};
G.connectLabelGlasses(bridge);WG.connectWinebraryGlasses(bridge,new URL('./',location.href).href);WG.setWinebraryDeviceConnected(true);UI.initLabelReview(document.querySelector('#library'));
const delay=ms=>new Promise(r=>setTimeout(r,ms));const until=async test=>{for(let i=0;i<100;i++){if(test())return;await delay(100);}throw Error('Timed out');};const result=document.querySelector('#checks'),checks=[];const check=(ok,label)=>{if(!ok)throw Error(label);checks.push('PASS '+label);result.textContent=checks.join('\n');};
document.querySelector('#run').onclick=async()=>{try{
const wines=(await Store.localWines()).slice(0,2).sort((a,b)=>a.wine_name.localeCompare(b.wine_name));if(wines.length<2)throw Error('Run batch QA once to seed isolated test wines.');WG.setLibrarySource(()=>({userId:'beta-local',loading:false,error:'',items:wines}));
options=await Promise.all(['w0','w1','w2'].map(async(id,i)=>({id,photo:await A.blobData(await (await realFetch('./bottles/'+id+'.png')).blob()),provenance:{identity_check:'QA option '+(i+1),vintage_binding:'QA representative photograph'}})));
await G.openLabelGlasses(wines);const s=S.labelSession();await until(()=>s.settled===2);await delay(500);await I.imageIdle();check(queries.length===2,'Both wines searched ahead');check(cuts.length===0,'No photo polished until chosen');check(page.containerTotalNum===6&&page.imageObject.length===2,'Valid six-container G2 layout with two bottle tiles');check(page.listObject[0].itemContainer.itemName[0]==='Use & polish label','Glasses exposes label selection');
G.handleLabelGlasses({listEvent:{eventType:0,currentSelectItemIndex:1}});await delay(650);await I.imageIdle();check(s.current.choice===1,'Next photo selects alternative label on G2');check(images.size===2,'Real candidate preview sent to G2');
G.handleLabelGlasses({listEvent:{eventType:0}});await until(()=>s.rows[0].work==='saved');await delay(650);await I.imageIdle();const saved=(await Store.localWines()).find(w=>w.id===wines[0].id);check(saved.metadata.bottle_provenance.identity_check==='QA option 2','Omitted protobuf zero selects and saves chosen photo 2');check(saved.notes===wines[0].notes,'Personal notes preserved');
G.handleLabelGlasses({listEvent:{eventType:0,currentSelectItemIndex:2}});await delay(650);await I.imageIdle();check(s.index===1,'Next wine moves sequentially');check(document.querySelector('#label-wine').value==='1','Phone mirrors glasses-selected wine');
const before=rebuilds;G.pauseLabelGlasses();s.photo(1);await delay(150);check(rebuilds===before,'Backgrounded glasses receive no redraw');await G.resumeLabelGlasses();await delay(500);await I.imageIdle();check(s.current.choice===1,'Resume restores current label selection');check(maxCalls===1,'Bridge image and text calls stay serialized');
G.handleLabelGlasses({sysEvent:{eventType:3}});await delay(650);await I.imageIdle();check(WG.isLibraryActive(),'Double tap returns to Winebrary, never exits app');
await G.openLabelGlasses();await delay(500);window.dispatchEvent(new Event('sommni-library-account-changing'));await delay(650);await I.imageIdle();check(S.labelSession()===null,'Account change clears label choices and pending results');
await WG.openLibraryOnGlasses();await delay(500);const polishIndex=page.listObject[0].itemContainer.itemName.findIndex(label=>label.startsWith('Polish'));check(polishIndex>0,'Winebrary menu exposes Polish bottle labels');WG.handleLibraryGlassesEvent({listEvent:{eventType:0,currentSelectItemIndex:polishIndex}});await until(()=>S.labelSession()?.settled===2);await delay(500);await I.imageIdle();result.textContent=checks.join('\n')+'\nAll checks passed.';
}catch(e){result.textContent+='\nFAIL '+e.stack;}};
</script>
