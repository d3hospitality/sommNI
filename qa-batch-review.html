<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Batch Winebrary check</title><style>body{background:#10120f;color:#e6e6dc;font:14px system-ui;max-width:900px;margin:20px auto;padding:16px;--gold:#dfc876;--line:#37392f;--muted:#adb09e;--bg-card:#151710}.wl-primary{background:#dfc876;color:#171810;border:0;border-radius:7px;padding:12px 18px;font:inherit;cursor:pointer}.wl-text-button{color:inherit;background:transparent;border:0;padding:10px;cursor:pointer}.depth-caption{font-size:12px;color:var(--muted)}[hidden]{display:none!important}</style><h1>Batch review check</h1><p>Isolated QA origin. Research and master receipts are mocked. Real catalog bottle files and device storage pipeline.</p><section id="wine-research"></section><button id="check">Check saved wines & upload receipts</button><pre id="result"></pre>
<script type="module">
if(location.hostname!=='sommni-batch-qa.localhost')throw Error('Use isolated QA origin sommni-batch-qa.localhost only.');
const realFetch=window.fetch.bind(window),receipts=[];
window.fetch=async(input,init)=>{const url=new URL(String(input),location.href);if(url.origin===location.origin||url.protocol==='data:')return realFetch(input,init);const body=JSON.parse(init?.body||'{}');if(body.action==='research'){const entry=catalog[Number(body.query.match(/\d+/)?.[0]||1)-1]||catalog[0];await new Promise(r=>setTimeout(r,Number(body.query.match(/\d+/)?.[0]||1)*900));const [wine_name,producer]=entry.wine.name.split(/\s+[–—]\s+/);return Response.json({draft:{id:'batch-qa-'+body.query,query:body.query,result:{wine_name,producer:producer||'',vintage_state:'year',vintage:2022,region:entry.wine.region,country:entry.country,color:entry.type,grape:entry.wine.grape,tasting_notes:entry.wine.palate},evidence:{sources:[]}}});}if(body.action==='contribute'){receipts.push(body);return Response.json({received:true,id:'qa-receipt'});}throw Error('QA blocked external request '+body.action);};
const {allCatalogWines}=await import('./src/identity');const catalog=allCatalogWines().filter(w=>w.legacyId&&w.legacyId!=='w105').slice(0,3);
const {setArtworkOwner,artworkStore}=await import('./src/artwork-store');setArtworkOwner('beta-local');
await import('./src/research/research.css');const {mountBatchResearch}=await import('./src/research/batch-phone');mountBatchResearch(document.querySelector('#wine-research'));
document.querySelector('textarea').value='Wine 1\nWine 2\nWine 3';
document.querySelector('#check').onclick=async()=>{const {localWines}=await import('./src/beta/store');const wines=await localWines(),outbox=(await artworkStore('getAll')).filter(r=>r.kind==='submission');document.querySelector('#result').textContent=JSON.stringify({count:wines.length,realPhotos:wines.every(w=>w.image_url?.startsWith('data:image/png')),names:wines.map(w=>w.wine_name),masterUploads:outbox.length,received:outbox.filter(r=>r.state==='sent').length},null,2);};
</script>
