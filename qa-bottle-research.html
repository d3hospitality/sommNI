<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>sommNI · Research bottle review check</title><style>body{font-family:Arial;background:#11150e;color:#ebeee4;max-width:850px;margin:30px auto;padding:24px}button,input,textarea,select{font:inherit;padding:10px;border-radius:6px;margin:6px;color:inherit;background:#22291b;border:1px solid #707b58}label{display:block}input[type=checkbox]{display:inline}a{color:#d0bd7b}p{line-height:1.5}.depth-caption{font-size:13px;color:#b5bda7}.wl-kicker{font-size:12px;letter-spacing:2px}.research-fields{display:grid;grid-template-columns:1fr 1fr}#wine-history{display:none}</style><h1>Research → bottle → Winebrary</h1><p>Local integration check using a prepared research fixture. No AI lookup is claimed. The form below is the app’s actual research component.</p><button id="prepare">Prepare test research draft</button><button id="cleanup">Remove this test draft and wine</button><p id="qa-status" role="status"></p><div id="wine-history"></div><script type="module">
import {initResearchPanel} from './src/research/phone.ts';import {localStore} from './src/beta/store.ts';
initResearchPanel();let id=null;
document.querySelector('#prepare').onclick=async()=>{if(id){document.querySelector('#qa-status').textContent='Resume the prepared draft below.';return;}id=crypto.randomUUID();await localStore('drafts','put',{id,created_at:new Date().toISOString(),query:'Vasse Felix Cabernet Sauvignon 2021',result:{wine_name:'Cabernet Sauvignon',producer:'Vasse Felix',vintage:2021,vintage_state:'year',region:'Margaret River',country:'Australia',grape:'Cabernet Sauvignon',color:'Red',tasting_notes:'QA fixture: notes must survive image attachment.',uncertainty:'Test fixture: verify the pictured vintage separately.'},report:'Prepared fixture for the image integration test.',evidence:{sources:[]}});document.querySelector('#qa-status').textContent='Prepared. Choose Resume latest draft below.';};
document.querySelector('#cleanup').onclick=async()=>{const fixtures=(await localStore('drafts','getAll')).filter(d=>d.report==='Prepared fixture for the image integration test.'&&d.result?.tasting_notes==='QA fixture: notes must survive image attachment.');for(const fixture of fixtures){const saved=await localStore('wines','get',fixture.id);if(saved?.metadata?.research_report===fixture.report)await localStore('wines','delete',fixture.id);await localStore('drafts','delete',fixture.id);}id=null;document.querySelector('#qa-status').textContent='Only this test draft and wine were removed.';};
</script></html>
